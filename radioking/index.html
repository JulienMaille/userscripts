<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radioking Player</title>
<style>
:root{--card-bg:rgba(10,10,20,0.45);--text:#fff;--text-dim:rgba(255,255,255,0.5);--text-dimmer:rgba(255,255,255,0.3);--border:rgba(255,255,255,0.06);--btn-bg:rgba(255,255,255,0.06);--btn-hover:rgba(255,255,255,0.12);--btn-active-bg:#fff;--btn-active-text:#111;--prog-bg:rgba(255,255,255,0.1);--prog-fill:rgba(255,255,255,0.65);--shadow:0 8px 48px rgba(0,0,0,0.4);--bg-filter:blur(50px) brightness(0.3) saturate(1.4)}
.light{--card-bg:rgba(255,255,255,0.55);--text:#111;--text-dim:rgb(0 0 0 / 75%);--text-dimmer:rgb(0 0 0 / 40%);--border:rgba(0,0,0,0.1);--btn-bg:rgba(0,0,0,0.04);--btn-hover:rgba(0,0,0,0.08);--btn-active-bg:#111;--btn-active-text:#fff;--prog-bg:rgba(0,0,0,0.08);--prog-fill:rgba(0,0,0,0.4);--shadow:0 8px 48px rgba(0,0,0,0.12);--bg-filter:blur(50px) brightness(0.7) saturate(0.8)}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#1a0f00;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,sans-serif;color:var(--text);transition:color .3s}

/* ---- backgrounds ---- */
#bg{position:fixed;top:-60px;left:-60px;right:-60px;bottom:-60px;background:linear-gradient(135deg,#2d1b00,#1a0f00,#3d2b1f) center/cover no-repeat;filter:var(--bg-filter);z-index:0;transition:background 1s ease,filter .4s}
#kawarp-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* ---- player card ---- */
#player-wrap{position:fixed;top:0;left:0;right:0;bottom:0;z-index:2;display:flex;align-items:center;justify-content:center;padding:20px}
#player{background:var(--card-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:20px;padding:28px;max-width:460px;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:var(--shadow);border:1px solid var(--border);transition:background .3s,box-shadow .3s,border-color .3s}
#player>:last-child{margin-bottom:0}

/* ---- top row: toggle + station pills ---- */
#top-row{width:100%;display:flex;align-items:center;gap:8px;margin-bottom:-4px}
#theme-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--btn-bg);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .3s,border-color .3s,color .3s;color:var(--text-dim)}
#theme-btn:hover{background:var(--btn-hover)}
#theme-btn svg{width:16px;height:16px;fill:currentColor}
#station-btns{display:flex;gap:6px;flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch}
#station-btns::-webkit-scrollbar{display:none}
.sta-btn{padding:5px 14px;border-radius:14px;border:1px solid var(--border);background:var(--btn-bg);color:var(--text-dim);font-size:12px;cursor:pointer;white-space:nowrap;transition:background .3s,border-color .3s,color .3s;flex-shrink:0}
.sta-btn:hover{background:var(--btn-hover);color:var(--text)}
.sta-btn.active{background:var(--btn-active-bg);color:var(--btn-active-text);border-color:transparent}

/* ---- cover ---- */
#cover-wrap{position:relative;width:220px;height:220px;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.5);flex-shrink:0;transition:width .3s,height .3s}
#cover{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .4s ease;opacity:0}

/* ---- track info ---- */
#track-info{width:100%;text-align:center}
#title{font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-0.3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
#artist{font-size:18px;font-weight:500;line-height:1.3;opacity:.85;transition:color .3s}
#artist .rk-album{color:var(--text-dimmer);transition:color .3s}

/* ---- progress ---- */
#progress-wrap{width:100%;margin-top:2px}
#progress-bar{height:4px;border-radius:2px;background:var(--prog-bg);overflow:hidden;transition:background .3s}
#progress-fill{height:100%;width:0%;border-radius:2px;background:var(--prog-fill);transition:none}
#time-row{display:flex;justify-content:space-between;font-size:11px;margin-top:3px;font-variant-numeric:tabular-nums;color:var(--text-dimmer);transition:color .3s}

/* ---- up next ---- */
#up-next{width:100%;text-align:right;font-size:12px;color:var(--text);padding-top:6px;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
#up-next .up-label{color:var(--text-dim);transition:color .3s}
#up-next .up-artist{color:var(--text-dim);transition:color .3s}
#up-next .up-anim{display:inline-block;animation:upSlide .6s cubic-bezier(.16,1,.3,1)}
@keyframes upSlide{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}

/* ---- history list ---- */
#history-wrap{width:100%;font-size:11px;color:var(--text-dim);border-top:1px solid var(--border);padding-top:8px;margin-top:-4px;max-height:0;overflow:hidden;transition:max-height .3s ease,opacity .3s,border-color .3s,color .3s;opacity:0}
#history-wrap.open{max-height:160px;opacity:1}
#history-toggle{background:none;border:none;color:var(--text-dimmer);cursor:pointer;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:4px 0;width:100%;text-align:left;display:flex;align-items:center;gap:6px;transition:color .3s}
#history-toggle:hover{color:var(--text-dim)}
#history-list{display:flex;flex-direction:column;gap:3px;margin-top:6px}
#history-list .h-item{display:flex;gap:6px;line-height:1.4;min-width:0;color:var(--text-dim);transition:color .3s}
#history-list .h-num{min-width:18px;text-align:right;flex-shrink:0;color:var(--text-dimmer);transition:color .3s}
#history-list .h-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#history-list .h-artist{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;color:var(--text-dimmer);transition:color .3s}

/* ---- controls ---- */
#controls{display:flex;align-items:center;gap:16px;margin-top:2px;width:100%}
#play-btn{width:48px;height:48px;border-radius:50%;background:var(--btn-bg);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .3s,border-color .3s,color .3s;flex-shrink:0;color:var(--text)}
#play-btn:hover{background:var(--btn-hover)}
#play-btn svg{fill:currentColor;width:24px;height:24px}
#play-btn .pause-icon{display:none}
#play-btn.playing .play-icon{display:none}
#play-btn.playing .pause-icon{display:block}

#volume-wrap{display:flex;align-items:center;gap:6px;flex:1;justify-content:flex-end}
#volume-wrap svg{width:16px;height:16px;fill:var(--text-dimmer);flex-shrink:0;transition:fill .3s}
#volume-slider{width:100%;max-width:80px;height:4px;border-radius:2px;background:var(--prog-bg);-webkit-appearance:none;-moz-appearance:none;appearance:none;outline:none;cursor:pointer;transition:background .3s}
#volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--text);cursor:pointer;transition:background .3s}
#volume-slider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--text);cursor:pointer;border:none;transition:background .3s}

/* ---- status indicators ---- */
#status-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;flex-shrink:0;transition:background .3s,box-shadow .3s}
#status-dot.disconnected{background:#f44336}
#status-dot.buffering{background:#ff9800;animation:statPulse .8s ease-in-out infinite}
@keyframes statPulse{0%,100%{opacity:1}50%{opacity:.3}}
#player.buffering #cover-wrap::after{content:'';position:absolute;inset:0;border-radius:16px;background:rgba(0,0,0,0.3);z-index:1;animation:bufPulse 1.2s ease-in-out infinite}
@keyframes bufPulse{0%,100%{opacity:.4}50%{opacity:.8}}

/* ---- landing ---- */
#landing{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#2d1b00,#1a0f00,#3d2b1f);padding:40px;text-align:center;color:#fff}
#landing h1{font-size:28px;font-weight:800;margin-bottom:8px;letter-spacing:-.5px}
#landing p{opacity:.6;margin-bottom:20px;line-height:1.5;max-width:400px}
#landing code{background:rgba(255,255,255,0.08);padding:2px 8px;border-radius:4px;font-size:14px}
#landing .examples{display:flex;flex-direction:column;gap:8px;margin-top:8px}
#landing .examples a{color:rgba(255,255,255,0.8);text-decoration:none;padding:8px 16px;border-radius:8px;background:rgba(255,255,255,0.06);transition:background .2s}
#landing .examples a:hover{background:rgba(255,255,255,0.12)}

/* ---- responsive ---- */
@media(max-width:500px){
  #player{padding:18px;border-radius:14px;max-width:94vw}
  #cover-wrap{width:160px;height:160px}
  #title{font-size:20px}
  #artist{font-size:15px}
  #up-next{font-size:11px}
  #controls{gap:10px}
  #volume-wrap{display:none}
}
@media(max-width:360px){
  #cover-wrap{width:120px;height:120px}
  #title{font-size:17px}
  #artist{font-size:13px}
}
</style>
</head>
<body>

<div id="bg"></div>
<canvas id="kawarp-canvas"></canvas>

<div id="player-wrap">
<div id="player">

  <div id="top-row">
    <div id="station-btns"></div>
    <button id="theme-btn" title="Toggle light/dark" aria-label="Toggle light/dark theme">
      <svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
    </button>
  </div>

  <div id="cover-wrap" style="background: linear-gradient(135deg, rgba(255,255,255,0.03), rgba(255,255,255,0.08)); display: flex; align-items: center; justify-content: center;">
    <img id="cover" src="" alt="cover">
  </div>

  <div id="track-info" style="min-height: 58px;">
    <div id="title">Connecting…</div>
    <div id="artist">Tune in to the stream</div>
  </div>

  <div id="progress-wrap">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="time-row"><span id="time-elapsed">--:--</span><span id="time-total">--:--</span></div>
  </div>

  <div id="up-next" style="min-height: 24px;">Waiting for playlist…</div>

  <div id="history-wrap">
    <div id="history-list"></div>
  </div>
  <button id="history-toggle">▶ History</button>

  <div id="controls">
    <button id="play-btn" aria-label="Play/Pause">
      <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <div id="status-dot" title="Connected"></div>
    <div id="volume-wrap">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 8.5v7a4.5 4.5 0 002.5-3.5zm4.5 0A9 9 0 0017 3.5v2.5A6.5 6.5 0 0119.5 12 6.5 6.5 0 0117 16v2.5A9 9 0 0021 12z"/></svg>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
    </div>
  </div>

</div>
</div>

<div id="landing">
  <h1>Radioking Player</h1>
  <p>A custom player for your favorite RadioKing stations.</p>
  <code>?slug=radiochoco-sound</code>
  <div class="examples">
    <a href="?slug=radiochoco-sound">Radio Choco</a>
    <a href="?slug=lemellotron-stream">Le Mellotron</a>
  </div>
</div>

<audio id="audio" preload="none"></audio>

<script type="module">
let DELTASEC = 4;
const DELTA_SAMPLES = [];
const STATIONS = [
  { label: 'Radio Choco', slug: 'radiochoco-sound' },
  { label: 'Le Mellotron', slug: 'lemellotron-stream' },
];

const params = new URLSearchParams(location.search);
const slugParam = params.get('slug');
const streamParam = params.get('stream');

if (!slugParam && !streamParam) {
  /* landing */
} else {
  startApp(slugParam, streamParam);
}

function startApp(slug, streamUrl) {
  document.getElementById('landing').style.display = 'none';

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('play-btn');
  const stationBtns = document.getElementById('station-btns');
  const coverEl = document.getElementById('cover');
  const titleEl = document.getElementById('title');
  const artistEl = document.getElementById('artist');
  const progressFill = document.getElementById('progress-fill');
  const timeElapsed = document.getElementById('time-elapsed');
  const timeTotal = document.getElementById('time-total');
  const upNextEl = document.getElementById('up-next');
  const historyWrap = document.getElementById('history-wrap');
  const historyList = document.getElementById('history-list');
  const historyToggle = document.getElementById('history-toggle');
  const bgEl = document.getElementById('bg');
  const canvas = document.getElementById('kawarp-canvas');
  const volumeSlider = document.getElementById('volume-slider');
  const statusDot = document.getElementById('status-dot');
  const themeBtn = document.getElementById('theme-btn');

  let kawarp = null;
  let startedAt = null;
  let trackDuration = 0;
  let lastTrackId = null;
  let lastChangeTs = 0;
  let prevStartedAt = null;
  let prevDuration = 0;
  let currentTitle = '';
  let currentArtist = '';
  let currentAlbum = '';
  let lastNextKey = '';
  let lastNextTs = 0;
  let isDark = true;
  let coverFadeTimer = null;
  let visualUpdateTimer = null;

  /* ---- canvas resize ---- */
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth;
    const h = canvas.clientHeight;
    if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      if (kawarp) kawarp.resize();
    }
  }
  window.addEventListener('resize', resizeCanvas);

  /* ---- station pill buttons ---- */
  STATIONS.forEach(s => {
    const btn = document.createElement('button');
    btn.className = 'sta-btn' + (s.slug === slug ? ' active' : '');
    btn.textContent = s.label;
    btn.addEventListener('click', () => { if (s.slug !== slug) location.search = `?slug=${s.slug}`; });
    stationBtns.appendChild(btn);
  });

  /* ---- theme toggle ---- */
  themeBtn.addEventListener('click', () => {
    isDark = !isDark;
    document.documentElement.classList.toggle('light', !isDark);
    localStorage.setItem('radioking-theme', isDark ? 'dark' : 'light');
    if (kawarp) {
      if (isDark) {
        kawarp.tintColor = [0.0, 0.0, 0.0];
      } else {
        kawarp.tintColor = [1.0, 1.0, 1.0];
      }
    }
  });

  /* ---- history toggle ---- */
  historyToggle.addEventListener('click', () => {
    const open = historyWrap.classList.toggle('open');
    historyToggle.textContent = open ? '▼ History' : '▶ History';
  });

  /* ---- audio ---- */
  audio.src = streamUrl || `https://play.radioking.io/${slug}`;
  /* ---- restore preferences ---- */
  const savedVol = localStorage.getItem('radioking-volume');
  if (savedVol !== null) { audio.volume = parseFloat(savedVol); volumeSlider.value = savedVol; }
  const savedTheme = localStorage.getItem('radioking-theme');
  if (savedTheme === 'light') { isDark = false; document.documentElement.classList.toggle('light', !isDark); }
  const savedDelta = localStorage.getItem(`radioking-delta-${slug}`);
  if (savedDelta !== null) { DELTASEC = Math.max(0, parseInt(savedDelta, 10)); }
  /* ---- end restore ---- */
  let userPlaying = false;

  /* ---- initial Media Session ---- */
  const station = STATIONS.find(s => s.slug === slug);
  const stationLabel = station ? station.label : slug;
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: stationLabel,
      artist: stationLabel,
      album: stationLabel,
    });
  }

  function forceLiveEdge() {
    try {
      if (audio.buffered.length > 0) {
        // Seek to 0.5s before the end of the buffered region (the closest to live edge)
        audio.currentTime = audio.buffered.end(audio.buffered.length - 1) - 0.5;
      }
    } catch(e) {}
  }

  playBtn.addEventListener('click', () => {
    if (audio.paused) { 
      audio.play().then(forceLiveEdge).catch(() => {}); 
      playBtn.classList.add('playing'); 
      userPlaying = true; 
    }
    else { audio.pause(); playBtn.classList.remove('playing'); userPlaying = false; }
  });
  audio.addEventListener('play', () => { playBtn.classList.add('playing'); if (kawarp) kawarp.start(); });
  audio.addEventListener('pause', () => { playBtn.classList.remove('playing'); if (kawarp) kawarp.stop(); });
  volumeSlider.addEventListener('input', () => { audio.volume = parseFloat(volumeSlider.value); localStorage.setItem('radioking-volume', volumeSlider.value); });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && userPlaying && audio.paused) {
      audio.play().then(forceLiveEdge).catch(() => {});
    }
  });

  /* ---- Media Session actions ---- */
  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('play', () => audio.play().then(forceLiveEdge));
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
  }

  /* ---- connection / buffering states ---- */
  audio.addEventListener('waiting', () => {
    document.getElementById('player').classList.add('buffering');
    statusDot.className = 'buffering';
    statusDot.title = 'Buffering…';
  });
  audio.addEventListener('canplay', () => {
    document.getElementById('player').classList.remove('buffering');
    statusDot.className = '';
    statusDot.title = 'Connected';
  });
  audio.addEventListener('playing', () => {
    document.getElementById('player').classList.remove('buffering');
    statusDot.className = '';
    statusDot.title = 'Connected';
  });
  audio.addEventListener('error', () => {
    statusDot.className = 'disconnected';
    statusDot.title = 'Disconnected';
  });

  /* ---- Kawarp ---- */
  async function initKawarp() {
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/@kawarp/core/+esm');
      kawarp = new mod.Kawarp(canvas, {
        warpIntensity: 1.0, blurPasses: 8, animationSpeed: 1.0,
        transitionDuration: 2000, saturation: 1.5,
        tintColor: [0.0, 0.0, 0.0], tintIntensity: 1.0,
      });
      resizeCanvas();
      kawarp.start();
    } catch (_) { console.warn('kawarp', _); }
  }
  initKawarp();

  function setBackground(url) {
    if (!url) return;
    bgEl.style.background = `url("${url.replace(/"/g, '%22')}") center/cover no-repeat`;
    if (kawarp) kawarp.loadImage(url);
  }

  /* ---- helpers ---- */
  function fixEnc(s) {
    if (!s) return s;
    try {
      const bytes = new Uint8Array(s.length);
      for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i) & 0xFF;
      return new TextDecoder('windows-1252').decode(bytes);
    } catch(e) { return s; }
  }
  function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function fmt(sec) { const m = Math.floor(sec / 60); const s = Math.floor(sec % 60); return `${m}:${String(s).padStart(2, '0')}`; }

  const API = `https://api.radioking.io/widget/radio/${slug}`;

  /* ---- poll current ---- */
  async function pollApi() {
    try {
      const r = await fetch(`${API}/track/current?_=${Date.now()}`, { credentials: 'omit' });
      if (!r.ok) return;
      const d = await r.json();
      if (!d || !d.id) return;
      const isSameTrack = (d.id === lastTrackId);
      const isFirstLoad = (lastTrackId === null);
      if (!isSameTrack) {
        if (!isFirstLoad && Date.now() - lastChangeTs < 5000) return;
        lastTrackId = d.id;
        lastChangeTs = Date.now();
      }
      
      /* ---- parse started_at ---- */
      const apiStartedAt = d.started_at ? new Date(d.started_at) : null;

      /* ---- calibrate delta from previous track transition ---- */
      if (!isSameTrack && prevStartedAt && prevDuration && apiStartedAt) {
        const predictedEnd = prevStartedAt.getTime() + prevDuration * 1000;
        const observedDelay = (Date.now() - predictedEnd) / 1000;
        console.log('[Delta Calibration]', {
          prevStartedAt: prevStartedAt.toISOString(),
          prevDuration,
          predictedEnd: new Date(predictedEnd).toISOString(),
          observedAt: new Date().toISOString(),
          observedDelaySeconds: observedDelay,
          currentDeltaSec: DELTASEC
        });
        if (observedDelay >= 0 && observedDelay < 60) {
          DELTA_SAMPLES.push(observedDelay);
          if (DELTA_SAMPLES.length > 10) DELTA_SAMPLES.shift();
          const sorted = [...DELTA_SAMPLES].sort((a, b) => a - b);
          DELTASEC = Math.max(0, Math.round(sorted[Math.floor(sorted.length / 2)]));
          localStorage.setItem(`radioking-delta-${slug}`, DELTASEC);
          console.log('[Delta Calibrated New Value]', DELTASEC);
        }
      }

      /* ---- update timings ---- */
      if (!isSameTrack && apiStartedAt) {
        prevStartedAt = apiStartedAt;
        prevDuration = d.duration || 0;
      }

      if (isSameTrack) return;

      const applyVisuals = () => {
        if (isFirstLoad && apiStartedAt) {
          startedAt = apiStartedAt;
        } else {
          startedAt = new Date(Date.now() - DELTASEC * 1000);
        }
        trackDuration = d.duration || 0;
        currentTitle = fixEnc(d.title || '');
        currentArtist = fixEnc(d.artist || '');
        currentAlbum = fixEnc(d.album || '');
        document.title = currentTitle && currentArtist ? `${currentArtist} - ${currentTitle}` : (currentTitle || currentArtist || 'Radioking Player');
        if (titleEl) titleEl.textContent = currentTitle;
        if (artistEl) {
          let txt = esc(currentArtist);
          if (currentAlbum) txt += ` <span class="rk-album">· ${esc(currentAlbum)}</span>`;
          artistEl.innerHTML = txt;
        }
        if (coverEl && d.cover) {
          if (!coverEl.src || coverEl.getAttribute('src') === '') {
            coverEl.src = d.cover;
            coverEl.style.opacity = '1';
          } else if (d.cover !== coverEl.src) {
            coverEl.style.opacity = '0';
            clearTimeout(coverFadeTimer);
            coverFadeTimer = setTimeout(() => {
              coverEl.src = d.cover;
              coverEl.style.opacity = '1';
            }, 200);
          }
          setBackground(d.cover);
        }
        /* ---- Media Session ---- */
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: currentTitle || stationLabel,
            artist: currentArtist || stationLabel,
            album: currentAlbum || stationLabel,
            artwork: d.cover ? [{ src: d.cover, sizes: '512x512', type: 'image/jpeg' }] : [],
          });
        }
        /* ---- refresh history ---- */
        pollHistory();
      };

      clearTimeout(visualUpdateTimer);
      if (isFirstLoad) {
        applyVisuals();
      } else {
        visualUpdateTimer = setTimeout(applyVisuals, DELTASEC * 1000);
      }
    } catch (_) {}
  }

  function scheduleNext() {
    let delay = 8000;
    if (startedAt && trackDuration) {
      const elapsed = (Date.now() - new Date(startedAt).getTime()) / 1000 - DELTASEC;
      if (elapsed >= trackDuration * 0.95) delay = 1000;
    }
    setTimeout(() => { pollApi(); scheduleNext(); }, delay);
  }
  setTimeout(() => { pollApi(); scheduleNext(); }, 500);

  /* ---- progress ---- */
  let lastWidth = 0;
  function updateProgress() {
    if (!startedAt || !trackDuration) {
      progressFill.style.transition = 'none';
      progressFill.style.width = '0%';
      lastWidth = 0;
      timeElapsed.textContent = '--:--';
      timeTotal.textContent = '--:--';
      return;
    }
    const elapsed = Math.max(0, (Date.now() - new Date(startedAt).getTime()) / 1000 - DELTASEC);
    const clamped = Math.min(elapsed, trackDuration);
    const newWidth = trackDuration > 0 ? (clamped / trackDuration * 100) : 0;
    
    // Disable transition if tab is hidden, if resetting, or if the width jump is too large (> 1.5%)
    const isHidden = document.visibilityState === 'hidden';
    const widthJump = Math.abs(newWidth - lastWidth);
    
    if (isHidden || newWidth === 0 || widthJump > 1.5) {
      progressFill.style.transition = 'none';
    } else {
      progressFill.style.transition = 'width 1s linear';
    }
    
    progressFill.style.width = `${newWidth}%`;
    lastWidth = newWidth;
    timeElapsed.textContent = fmt(clamped);
    timeTotal.textContent = fmt(trackDuration);
  }
  setInterval(updateProgress, 1000);

  /* ---- up next ---- */
  async function pollNextTrack() {
    try {
      const r = await fetch(`${API}/track/next?_=${Date.now()}`, { credentials: 'omit' });
      if (!r.ok) { upNextEl.style.display = 'none'; return; }
      const list = await r.json();
      if (!list || !list.length) { upNextEl.style.display = 'none'; return; }
      upNextEl.style.display = '';
      const n = list[0];
      const nTitle = fixEnc(n.title || '');
      const nArtist = fixEnc(n.artist || '');
      const key = `${nTitle}|${nArtist}`;
      const now = Date.now();
      const anim = (key !== lastNextKey && now - lastNextTs > 500);
      if (anim) { lastNextKey = key; lastNextTs = now; }
      const html = `♪ <span class="up-label">Up Next</span> <span style="opacity:.3;margin:0 4px;">·</span> ${esc(nTitle)} <span style="opacity:.3;margin:0 4px;">·</span> <span class="up-artist">${esc(nArtist)}</span>`;
      upNextEl.innerHTML = anim ? `<span class="up-anim">${html}</span>` : `<span>${html}</span>`;
    } catch (_) { upNextEl.style.display = 'none'; }
  }
  setTimeout(pollNextTrack, 1000);
  setInterval(pollNextTrack, 5000);

  /* ---- history ---- */
  function renderHistory(list) {
    if (!list || !list.length) { historyList.innerHTML = ''; return; }
    const filtered = list.filter(t => t.title !== currentTitle || t.artist !== currentArtist);
    if (!filtered.length) { historyList.innerHTML = '<div style="opacity:.35">No previous tracks</div>'; return; }
    const parts = [];
    for (let i = 0; i < Math.min(filtered.length, 5); i++) {
      const t = filtered[i];
      parts.push(`<div class="h-item"><span class="h-num">${i+1}.</span><span class="h-title">${esc(fixEnc(t.title||''))}</span><span class="h-artist">${esc(fixEnc(t.artist||''))}</span></div>`);
    }
    historyList.innerHTML = parts.join('');
  }

  async function pollHistory() {
    try {
      const r = await fetch(`${API}/track/history?_=${Date.now()}`, { credentials: 'omit' });
      if (!r.ok) return;
      renderHistory(await r.json());
    } catch (_) {}
  }
  setTimeout(pollHistory, 2000);
  setInterval(pollHistory, 60000);
}
</script>
</body>
</html>
